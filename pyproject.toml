[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shhc"
version = "0.1.0"
description = "Security HTTP Headers Checker - note les en-tetes de securite d'une URL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
shhc = "shhc.cli:app"

[tool.setuptools.packages.find]
include = ["shhc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
