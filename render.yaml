services:
  - type: web
    name: shhc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn shhc.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Cle du service de redaction des recommandations. `sync: false` la
      # laisse a saisir dans le tableau de bord Render : elle ne doit pas
      # transiter par le depot. Sans elle, le service demarre quand meme et
      # sert les recommandations statiques.
      - key: SHHC_AI_KEY
        sync: false
