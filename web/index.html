<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security HTTP Headers Checker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --ok: #3fb950;
    --weak: #d29922;
    --missing: #f85149;
    --accent: #4c8dff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --border: #e1e4ea;
      --text: #1c2128; --muted: #626b7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; }

  form { display: flex; gap: .6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  input[type=url], input[type=text] {
    flex: 1 1 320px; min-width: 0;
    padding: .7rem .9rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: .7rem 1.3rem; border-radius: 8px; border: 0;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: progress; }

  .msg { padding: .85rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
  .msg.error { border-color: var(--missing); color: var(--missing); }

  .score {
    display: flex; align-items: center; gap: 1.1rem;
    padding: 1.1rem 1.3rem; margin-bottom: 1.2rem;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 5px solid var(--muted); border-radius: 10px;
  }
  .score.A, .score.B { border-left-color: var(--ok); }
  .score.C, .score.D { border-left-color: var(--weak); }
  .score.F { border-left-color: var(--missing); }
  .grade { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .score.A .grade, .score.B .grade { color: var(--ok); }
  .score.C .grade, .score.D .grade { color: var(--weak); }
  .score.F .grade { color: var(--missing); }
  .score-meta { min-width: 0; }
  .score-meta strong { font-size: 1.05rem; }
  .score-meta div { color: var(--muted); font-size: .88rem; word-break: break-all; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { padding: .65rem .8rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .84em; }
  td.val code { color: var(--muted); word-break: break-all; }

  .badge { display: inline-block; padding: .12rem .55rem; border-radius: 999px; font-size: .76rem; font-weight: 600; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.weak { background: color-mix(in srgb, var(--weak) 18%, transparent); color: var(--weak); }
  .badge.missing { background: color-mix(in srgb, var(--missing) 18%, transparent); color: var(--missing); }

  h2 { font-size: 1.05rem; margin: 1.6rem 0 .6rem; }
  ul.reco { margin: 0; padding-left: 1.1rem; }
  ul.reco li { margin-bottom: .45rem; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .84rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Security HTTP Headers Checker</h1>
    <p class="sub">Six en-têtes de sécurité évalués, une note de 0 à 100.</p>
  </header>

  <form id="form">
    <input id="url" type="text" placeholder="exemple.com" value="mozilla.org"
           autocomplete="url" spellcheck="false" required>
    <button id="go" type="submit">Analyser</button>
  </form>

  <div id="out" aria-live="polite"></div>

  <footer>
    Les redirections sont suivies : c'est l'URL finale qui est notée.
    <a href="/docs">Documentation de l'API</a>
  </footer>
</div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('url');
const bouton = document.getElementById('go');
const out = document.getElementById('out');

const escape = (s) => String(s).replace(/[&<>"]/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = input.value.trim();
  if (!url) return;

  bouton.disabled = true;
  out.innerHTML = '<div class="msg">Analyse en cours…</div>';

  try {
    const reponse = await fetch('/api/check?url=' + encodeURIComponent(url));
    const data = await reponse.json();
    if (!reponse.ok) {
      out.innerHTML = `<div class="msg error">${escape(data.detail || 'Erreur inconnue')}</div>`;
      return;
    }
    afficher(data);
  } catch (err) {
    out.innerHTML = `<div class="msg error">Requête impossible : ${escape(err.message)}</div>`;
  } finally {
    bouton.disabled = false;
  }
});

function afficher(data) {
  const lignes = data.findings.map(f => `
    <tr>
      <td><strong>${escape(f.header)}</strong></td>
      <td><span class="badge ${escape(f.status)}">${escape(f.status)}</span></td>
      <td class="val"><code>${f.value ? escape(f.value) : '—'}</code></td>
      <td class="num">${f.points}/${f.weight}</td>
      <td>${escape(f.reason)}</td>
    </tr>`).join('');

  const problemes = data.findings.filter(f => f.status !== 'ok');
  const reco = problemes.length
    ? `<h2>Recommandations</h2><ul class="reco">${problemes.map(f =>
        `<li><strong>${escape(f.header)}</strong> — ${escape(f.recommendation || '')}</li>`).join('')}</ul>`
    : `<h2>Recommandations</h2><p>Aucune : tous les en-têtes sont corrects.</p>`;

  out.innerHTML = `
    <div class="score ${escape(data.grade)}">
      <div class="grade">${escape(data.grade)}</div>
      <div class="score-meta">
        <strong>${data.score}/100</strong>
        <div>${escape(data.url)}</div>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>En-tête</th><th>Statut</th><th>Valeur</th><th>Points</th><th>Raison</th>
        </tr></thead>
        <tbody>${lignes}</tbody>
      </table>
    </div>
    ${reco}`;
}
</script>
</body>
</html>
